<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Luminova | Secure Geospatial Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Luminova provides secure geospatial intelligence and cyber security services for Australian government and industry. BuyICT panel supplier based in Canberra.">

<style>
:root {
  --blue:#0b3c5d;
  --green:#0f766e;
  --gold:#d4af37;
  --light:#f5f7fa;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background:#fff;
  color:#1f2933;
  line-height:1.6;
}

header {
  background:linear-gradient(135deg, var(--blue), var(--green));
  color:white;
  padding:2rem 1rem;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:0 1rem;
}

nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

nav a {
  color:white;
  margin-left:1rem;
  text-decoration:none;
  font-size:0.9rem;
}

nav a:hover {
  text-decoration:underline;
}

nav .logo-container {
  display:flex;
  align-items:center;
}

nav .logo-container img {
  height:50px;
  width:auto;
  margin-right:0.8rem;
}

.hero {
  display:grid;
  grid-template-columns:1fr;
  gap:2rem;
  margin-top:2rem;
}

.hero h1 {
  font-size:2.2rem;
  margin-bottom:0.5rem;
}

.badge {
  display:inline-block;
  background:rgba(255,255,255,0.15);
  padding:0.4rem 0.8rem;
  border-radius:4px;
  font-size:0.8rem;
  margin-top:1rem;
}

section {
  padding:4rem 1rem;
}

.section-alt {
  background:var(--light);
}

.grid {
  display:grid;
  gap:2rem;
}

@media(min-width:768px) {
  .hero, .grid { grid-template-columns:1fr 1fr; }
  .grid.three { grid-template-columns:1fr 1fr 1fr; }
}

.card {
  background:white;
  padding:1.5rem;
  border-radius:8px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

h2 {
  color:var(--blue);
}

.tag {
  font-size:0.75rem;
  background:#e0f2f1;
  color:var(--green);
